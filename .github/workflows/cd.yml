# On push to main: build a multi-arch image, push it to GHCR, deploy it to the
# server over SSH, smoke test /health and roll back if it fails.
#
# Required secrets and variables are listed in the README.

name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

# one deploy at a time, never cancel one halfway
concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.ref.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read VERSION and image name
        id: ref
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          # GHCR requires lowercase repository names
          NAME=$(echo "${REGISTRY}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          {
            echo "semver=${VERSION}"
            echo "name=${NAME}"
            echo "image=${NAME}:sha-${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ref.outputs.name }}
          tags: |
            # immutable tag that gets deployed
            type=sha,format=long
            # human readable release tags
            type=raw,value=${{ steps.ref.outputs.semver }}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

  deploy:
    name: Deploy to Contabo
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER || 'deploy' }}
      APP_DIR: ${{ vars.APP_DIR || '/opt/devops-task' }}
      HEALTH_URL: ${{ vars.HEALTH_CHECK_URL }}
      HAS_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN != '' }}

    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
            ConnectTimeout 15
          EOF

      - name: Login to GHCR on the server
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        if: env.HAS_PULL_TOKEN == 'true'
        run: |
          printf '%s' "$GHCR_PULL_TOKEN" | \
            ssh server "docker login ghcr.io -u '${{ github.repository_owner }}' --password-stdin"

      # Sync compose files, monitoring config and scripts to this commit,
      # then let deploy.sh swap the container (it rolls back on its own
      # if the new container never becomes healthy).
      - name: Deploy
        run: |
          ssh server bash -s -- "$APP_DIR" "$GITHUB_SHA" "$IMAGE" <<'EOF'
          set -euo pipefail
          cd "$1"
          git fetch --quiet --depth 1 origin "$2"
          git checkout --quiet --force FETCH_HEAD
          ./scripts/deploy.sh "$3"
          # pick up compose changes (leaves the app alone), then reload configs
          docker compose up -d --remove-orphans
          docker compose kill -s SIGHUP prometheus alloy
          EOF

      - name: Smoke test /health
        id: smoke
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$HEALTH_URL" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::health check failed at $HEALTH_URL"
          exit 1

      # The container was healthy on the box but unreachable from outside
      # (firewall, port, crash right after start...). Go back to the last good image.
      - name: Roll back
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          ssh server bash -s -- "$APP_DIR" <<'EOF'
          cd "$1" && ./scripts/deploy.sh --rollback
          EOF
          echo "::warning::rolled back, $IMAGE did not pass the smoke test"
