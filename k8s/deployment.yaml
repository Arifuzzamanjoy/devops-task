apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-task
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-task
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: devops-task
          image: ghcr.io/arifuzzamanjoy/devops-task:1.0.0
          ports:
            - name: http
              containerPort: 8080
          # Endpoint removal and SIGTERM happen at the same time, so keep serving
          # for a few seconds until the Service stops sending traffic here
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          envFrom:
            - configMapRef:
                name: devops-task-config
            - secretRef:
                name: devops-task-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
