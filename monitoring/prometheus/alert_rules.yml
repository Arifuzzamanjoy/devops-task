# Thresholds and "for" durations are explained in the README.

groups:
  - name: app
    rules:
      - alert: AppInstanceDown
        expr: up{job="app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "App is down"
          description: "{{ $labels.instance }} has not answered scrapes for 1 minute."

      - alert: HighErrorRate
        # sum both sides, otherwise each 5xx series is divided by itself
        expr: sum(rate(http_requests_total{job="app", status=~"5.."}[5m])) / sum(rate(http_requests_total{job="app"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests fail"
          description: "5xx ratio is {{ $value | humanizePercentage }} over the last 5 minutes."

  - name: infrastructure
    rules:
      - alert: HostDiskUsageHigh
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk above 80%"
          description: "{{ $labels.mountpoint }} is {{ $value | printf \"%.1f\" }}% full."

      - alert: ContainerMemoryNearLimit
        # working set is what the OOM killer counts; "> 0" skips containers without a limit,
        # "by (name)" merges the old and new series of a recreated container
        expr: sum by (name) (container_memory_working_set_bytes{name!=""}) / (max by (name) (container_spec_memory_limit_bytes{name!=""}) > 0) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container close to its memory limit"
          description: "{{ $labels.name }} uses {{ $value | humanizePercentage }} of its limit."
